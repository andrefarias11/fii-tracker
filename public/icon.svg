<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  <!-- Prédios FII estilizados -->
  <rect x="120" y="210" width="80" height="200" rx="12" fill="#1e293b" stroke="#334155" stroke-width="6" />
  <rect x="216" y="140" width="96" height="270" rx="14" fill="#0f766e" stroke="#14b8a6" stroke-width="6" />
  <rect x="328" y="240" width="72" height="170" rx="12" fill="#1e293b" stroke="#334155" stroke-width="6" />
  <!-- Janelas -->
  <circle cx="248" cy="180" r="8" fill="#99f6e4" />
  <circle cx="280" cy="180" r="8" fill="#99f6e4" />
  <circle cx="248" cy="220" r="8" fill="#99f6e4" />
  <circle cx="280" cy="220" r="8" fill="#99f6e4" />
  <circle cx="248" cy="260" r="8" fill="#99f6e4" />
  <circle cx="280" cy="260" r="8" fill="#99f6e4" />
  <!-- Gráfico de valorização ascendente -->
  <path d="M 100 340 Q 230 300 280 210 T 420 120" fill="none" stroke="url(#emerald)" stroke-width="14" stroke-linecap="round" />
  <!-- Seta -->
  <polygon points="420,100 440,135 405,135" fill="#34d399" />
  <!-- Moeda / Cifrão -->
  <circle cx="410" cy="380" r="42" fill="url(#emerald)" />
  <text x="410" y="396" font-size="44" font-family="Arial, sans-serif" font-weight="bold" fill="#ffffff" text-anchor="middle">$</text>
</svg>

